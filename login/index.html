<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspirare - Login</title>
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/feedback.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <h1>Inspirare</h1>
                <p>Seu espaço de acolhimento e equilíbrio</p>
            </div>

            <form class="login-form" id="login-form">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="toggle-password">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <a href="../forgot-password/index.html" class="forgot-password">Esqueci minha senha</a>
                </div>
                <button type="submit" class="btn-login">Entrar</button>


                <div class="form-footer">
                    <p>Não tem uma conta? <a href="../signup/index.html" class="signup-link">Cadastre-se agora</a></p>
                </div>
                <div style="margin-top: 15px; text-align: center;">
                    <a href="https://wa.me/11942271174" target="_blank" class="btn-contact">
                        Entrar em contato
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/ui.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/ui-feedback.js"></script>
    <script>
        // Garante que o Lucide renderize os icones presentes no DOM
        if (window.lucide) lucide.createIcons();

        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            // Toggle the type attribute
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Toggle the icon by updating the innerHTML and then re-initializing Lucide
            this.innerHTML = `<i data-lucide="${type === 'text' ? 'eye-off' : 'eye'}"></i>`;
            lucide.createIcons();
        });

        // Login submit -> POST /api/auth/login
        const loginForm = document.getElementById('login-form');

        // Redirect by role: user -> user home; admin/funcionario -> admin home.
        // Unknown / missing roles fall back to the user home (safer than blocking login).
        function redirectByRole(role) {
            if (role === 'admin' || role === 'funcionario') {
                return '../admin/home/main/index.html';
            }
            return '../user/home/main/index.html';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            InspirareFeedback.clearError(loginForm);

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';

            try {
                const data = await InspirareAuth.api('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password }),
                });
                if (data.session && data.session.access_token) {
                    InspirareAuth.setToken(data.session.access_token);
                }
                if (data.profile) {
                    InspirareAuth.setProfile(data.profile);
                }
                window.location.href = redirectByRole(data.profile && data.profile.role);
            } catch (err) {
                let msg = 'Erro ao entrar. Tente novamente.';
                if (err.status === 401) msg = 'E-mail ou senha incorretos.';
                else if (err.status === 400 && err.fields) {
                    msg = Object.entries(err.fields)
                        .map(([k, v]) => `${k}: ${v}`)
                        .join('\n');
                }
                InspirareFeedback.showError(loginForm, msg);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
