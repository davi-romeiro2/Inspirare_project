<!DOCTYPE html>
  <html lang="pt-br">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Inspirare - Editar Perfil</title>
      <link rel="stylesheet" href="../main/style.css">
      <link rel="stylesheet" href="profile-style.css">
      <link rel="stylesheet" href="../../menu/style.css">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap"
   rel="stylesheet">
      <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
      <!-- Botão Hambúrguer Global -->
      <button class="menu-toggle" onclick="toggleMenu()" aria-label="Abrir Menu">
          <i data-lucide="menu"></i>
      </button>

      <!-- Sidebar Navigation -->
      <nav class="sidebar" id="main-sidebar">
          <div class="sidebar-brand">
              <h1>Inspirare</h1>
          </div>
          <ul class="menu-list">
              <li>
                  <a href="../main/index.html" class="menu-item">
                      <i data-lucide="home"></i> <span>Home</span>
                  </a>
              </li>
              <li>
                  <a href="../about/about.html" class="menu-item">
                      <i data-lucide="info"></i> <span>Sobre a Inspirare</span>
                  </a>
              </li>
              <li>
                  <a href="profile.html" class="menu-item active">
                      <i data-lucide="user"></i> <span>Editar Perfil</span>
                  </a>
              </li>
              <li style="margin-top: auto;">
                  <a href="../../../login/index.html" class="menu-item logout-item">
                      <i data-lucide="log-out"></i> <span>Logout</span>
                  </a>
              </li>
          </ul>
      </nav>

      <div class="main-content" id="main-content">
          <header class="main-header">
              <h1>Meu Perfil</h1>
              <div class="user-profile-nav">
                  <span>Olá, Usuário</span>
                  <div class="nav-avatar"></div>
              </div>
          </header>

          <!-- Custom Modal -->
          <div id="custom-modal" class="custom-modal-overlay">
              <div class="custom-modal">
                  <h3 id="modal-title">Aviso</h3>
                  <p id="modal-text">Mensagem aqui</p>
                  <button class="btn-modal" id="modal-btn">Ok</button>
              </div>
          </div>
          <!-- Password Modal -->
          <div id="password-modal" class="custom-modal-overlay">
              <div class="custom-modal">
                  <h3 id="password-modal-title">Confirmação de senha</h3>
                  <p id="password-modal-text">Por favor, insira sua senha atual para confirmar a alteração de e-mail:</p>
                  <input type="password" id="password-input" class="password-input" placeholder="Senha atual" required>
                  <div class="modal-buttons">
                      <button class="btn-modal" id="password-cancel">Cancelar</button><button class="btn-modal" id="password-confirm">Confirmar</button>
                  </div>
              </div>
          </div>

          <div class="profile-container">
              <div class="profile-card">

                  <form class="profile-form">
                    <div class="edit-btn-wrapper">
                      <button type="button" class="edit-profile-btn"><i data-lucide="edit"></i> Editar</button>
                    </div>
                    <div class="form-grid">
                      <div class="input-group">
                        <label>Nome Completo</label>
                        <input type="text" value="Usuário Inspirare" required disabled>
                      </div>
                      <div class="input-group">
                        <label>E-mail</label>
                        <input type="email" value="usuario@email.com" required disabled>
                      </div>
                      <div class="input-group">
                        <label>Telefone</label>
                        <input type="text" value="(11) 99999-9999" required disabled>
                      </div>
                    </div>
                    <button type="submit" class="btn-save-profile" disabled>Salvar Alterações</button>
                  </form>
              </div>
          </div>
      </div>

      <script src="index.js"></script>
  </body>
  </html>
